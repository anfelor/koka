name:       lidar
version:    0.1.0
license:    Apache-2.0
author:     Anton Lorenzen

description: The typed intermediate representation of Koka's typed backend.

dependencies:
  - base >= 4.9
  - containers
  - mtl
  - parsec

library:
  source-dirs:
    - src
  ghc-options:
    - -O2
    - -Wall
    - -Wno-x-partial      # as in koka
    - -Wno-name-shadowing
    - -Wno-orphans        # Pretty instances of the IR live in Lidar.Pretty
